name: Build System Image

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  VENDOR: xiaomi
  DEVICE: clover
  ANDROID_ROOT: /home/runner/work/halium/

jobs:
  build:
    name: Build Halium 11.0 Images
    runs-on: ubuntu-latest # Ubuntu Latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4


    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: false
    - name: Build System Image in Docker
      run: |
        mkdir -p ${{ env.ANDROID_ROOT }}
        docker run --rm -v ${{ env.ANDROID_ROOT }}:/home/builder/halium -e ANDROID_ROOT=/home/builder/halium -e VENDOR=${{ env.VENDOR }} -e DEVICE=${{ env.DEVICE }} ubuntu:20.04 /bin/bash -c '
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y python-is-python3 python3-dev openjdk-11-jdk android-tools-adb bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libwxgtk3.2-dev libxml2 libxml2-utils lzop rsync schedtool squashfs-tools xsltproc yasm zip zlib1g-dev git sudo wget
        
        ln -sf /usr/bin/python3 /usr/bin/python
        
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=$PATH:~/bin
        
        git config --global user.name "CI-Builder"
        git config --global user.email "ci@example.com"
        
        mkdir -p $ANDROID_ROOT
        cd $ANDROID_ROOT
        
        ~/bin/repo init -u https://github.com/Halium/android -b halium-11.0 --depth=1
        
        mkdir -p .repo/local_manifests
        cat <<EOF > .repo/local_manifests/clover.xml
        <?xml version="1.0" encoding="UTF-8"?>
        <manifest>
          <project path="kernel/xiaomi/clover" name="ubuntu-touch-clover/halium_kernel_xiaomi_clover" remote="github" revision="halium-9.0" />
          <project path="device/xiaomi/clover" name="kyasu/android_device_xiaomi_clover" remote="github" revision="lineage-18.1" />
          <project path="vendor/xiaomi/clover" name="zeelog/proprietary_vendor_xiaomi" remote="github" revision="lineage-18.1" />
        </manifest>
        EOF
        
        ~/bin/repo sync -j$(nproc) -c --no-clone-bundle --no-tags --current-branch
        
        source build/envsetup.sh
        lunch lineage_${DEVICE}-userdebug || lunch aosp_${DEVICE}-userdebug
        
        mka halium-boot systemimage vendorimage
        '
      shell: bash

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: halium-11-clover-images
        path: |
          ${{ env.ANDROID_ROOT }}/out/target/product/${{ env.DEVICE }}/halium-boot.img
          ${{ env.ANDROID_ROOT }}/out/target/product/${{ env.DEVICE }}/system.img
          ${{ env.ANDROID_ROOT }}/out/target/product/${{ env.DEVICE }}/vendor.img
